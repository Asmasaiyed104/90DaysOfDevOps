name: Day 44 - Secrets Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/day44-secrets.yml'

jobs:
  secrets-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Task 1 - confirm the secret exists WITHOUT ever printing its value
      - name: Confirm secret is set (safe way)
        env:
          SECRET_IS_SET: ${{ secrets.MY_SECRET_MESSAGE != '' }}
        run: echo "The secret is set: $SECRET_IS_SET"

      # Task 1, point 4 - try to print the raw secret directly.
      # GitHub automatically detects it's a secret reference and masks the
      # value in the log output with *** instead of showing the real text.
      - name: Try to print the secret directly (will be masked)
        run: echo "Raw secret value -> ${{ secrets.MY_SECRET_MESSAGE }}"

      # Task 2 - pass the secret in as an env var and use it in a shell
      # command. Nothing is hardcoded, and the value is never echoed.
      - name: Use secret as an environment variable
        env:
          SECRET_MESSAGE: ${{ secrets.MY_SECRET_MESSAGE }}
        run: |
          if [ -n "$SECRET_MESSAGE" ]; then
            echo "Secret env var is available to this step (length: ${#SECRET_MESSAGE} chars)"
          else
            echo "Secret env var was empty - check repo secrets"
            exit 1
          fi

      # Task 2 - demonstrate DOCKER_USERNAME / DOCKER_TOKEN usage
      # (these secrets get created in the repo UI, not in code - see notes.md)
      - name: Simulate docker login using secrets (no hardcoding)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_TOKEN" ]; then
            echo "Docker credentials are available for Day 45 (values not shown)"
          else
            echo "Docker secrets not configured yet - add them in Settings > Secrets"
          fi
